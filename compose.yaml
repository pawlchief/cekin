name: cekin

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Jakarta
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone=+07:00
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql   
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    build: .
    image: cekin-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:

      DB_HOST: db
      DB_PORT: "3306"
      PORT: "3001"
      NODE_ENV: production

    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3001"
    logging: *logging

volumes:
  db_data: